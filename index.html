<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>GymStack — прототип</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=swap">
<style>
/* ============================================================================
   GymStack · design tokens · v0.1 · 03.10.2026
   Две темы: day = направление C «Glass over Calm», night = направление D «Iron».
   Политика акцента на корне приложения: data-accent="daynight" (день синий,
   ночь оранжевый) или data-accent="brand" (синий всегда, оранжевый = энергия).
   Тема ставится на .gs (корень приложения) или на любой вложенный блок:
   экран тренировки получает data-theme="night" и в дневной теме.
   ============================================================================ */
.gs{
  /* шрифт: системный для текста, акцидентный только для крупных цифр */
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-num:"Manrope",ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
  --text-xs:11px;--text-sm:13px;--text-md:15px;--text-lg:17px;--text-xl:20px;--text-2xl:24px;--text-3xl:32px;--text-num:64px;
  --lh:1.35;--lh-tight:1.08;
  /* сетка 4/8, радиусы, цели для пальца */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;
  --r-s:8px;--r-m:12px;--r-l:16px;--r-xl:22px;--r-pill:999px;
  --tap:44px;
  /* движение: только transform и opacity */
  --dur-fast:120ms;--dur:220ms;--dur-slow:320ms;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
  /* стекло: не больше трёх слоёв на экране */
  --blur:16px;
  font-family:var(--font-ui);font-size:var(--text-md);line-height:var(--lh);
  color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
@supports (animation-timing-function:linear(0,1)){
  .gs{--ease-spring:linear(0,.006,.025 2.8%,.101 6.1%,.539 18.9%,.721 25.3%,.849 31.5%,.937 38.1%,.968 41.8%,.991 45.7%,1.006 50.1%,1.015 55%,1.017 63.9%,1.001)}
}

/* ---------------- DAY · направление C ---------------- */
.gs[data-theme="day"],.gs [data-theme="day"]{
  color-scheme:light;
  --bg:#F4F5F8;--bg-aura:radial-gradient(70% 22% at 50% -6%,#D9E6FF 0,transparent 72%);
  --surface:#FFFFFF;--surface-grad:#FFFFFF;--surface-2:#EEF0F4;--surface-border:#E4E6EC;
  --text:#0E0F13;--text-2:#656B78;--text-3:#9AA0AC;--line:#E4E6EC;
  --accent:#1E6BFF;--on-accent:#FFFFFF;--accent-soft:#E8F0FF;--accent-glow:rgba(30,107,255,.28);
  --energy:#FF7A2F;--energy-soft:#FFEFE6;--on-energy:#1B0F06;
  --ok:#1F9D4D;--ok-soft:#E4F5EA;--warn:#C47A0E;--warn-soft:#FDF1DC;--bad:#D83C43;--bad-soft:#FCE6E7;
  --plate:#1B2238;--plate-used:#DFE2E9;--plate-sheen:inset 0 1px 0 rgba(255,255,255,.22);
  --glass-bg:rgba(255,255,255,.66);--glass-border:rgba(255,255,255,.85);--glass-highlight:#FFFFFF;
  --shadow-1:0 1px 2px rgba(14,15,19,.05);--shadow-2:0 8px 24px rgba(20,30,60,.12);
  --btn-sheen:rgba(255,255,255,.34);--btn-inset:rgba(255,255,255,.45);
  --tab-inset:12px;--tab-bottom:10px;--tab-radius:999px;--tab-h:54px;--tab-bg:var(--glass-bg);--tab-border:var(--glass-border);--tab-shadow:0 8px 24px rgba(20,30,60,.14),inset 0 1px 0 #fff;
  --toast-bg:#0E0F13;--toast-fg:#FFFFFF;
  --chip:#EEF0F4;--chip-text:#0E0F13;
  --hdr-bg:rgba(244,245,248,.74);--hdr-border:rgba(14,15,19,.06);
  --sheet-bg:rgba(255,255,255,.86);--sheet-border:rgba(255,255,255,.9);
  --phone-frame:#14161B;
}
/* ---------------- NIGHT · направление D ---------------- */
.gs[data-theme="night"],.gs [data-theme="night"]{
  color-scheme:dark;
  --bg:#0B0C10;--bg-aura:radial-gradient(70% 28% at 50% -8%,rgba(255,122,47,.16) 0,transparent 70%);
  --surface:#15171D;--surface-grad:linear-gradient(180deg,#1A1D24,#15171D);--surface-2:#1E222B;--surface-border:#23262E;
  --text:#F4F5F7;--text-2:#9AA0AA;--text-3:#6C727C;--line:#23262E;
  --accent:#FF7A2F;--on-accent:#0B0C10;--accent-soft:rgba(255,122,47,.14);--accent-glow:rgba(255,122,47,.45);
  --energy:#FF7A2F;--energy-soft:rgba(255,122,47,.14);--on-energy:#0B0C10;
  --ok:#3DBE6C;--ok-soft:rgba(61,190,108,.14);--warn:#F0B14A;--warn-soft:rgba(240,177,74,.14);--bad:#F26B70;--bad-soft:rgba(242,107,112,.14);
  --plate:linear-gradient(180deg,#FFA76F,#E0651F);--plate-used:linear-gradient(180deg,#2E323B,#1C1F26);--plate-sheen:inset 0 1px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.6);
  --glass-bg:rgba(21,23,29,.82);--glass-border:rgba(255,255,255,.08);--glass-highlight:rgba(255,255,255,.06);
  --shadow-1:none;--shadow-2:0 10px 28px rgba(0,0,0,.45);
  --btn-sheen:rgba(255,255,255,.14);--btn-inset:rgba(255,255,255,.18);
  --tab-inset:0px;--tab-bottom:0px;--tab-radius:0px;--tab-h:62px;--tab-bg:rgba(11,12,16,.88);--tab-border:var(--line);--tab-shadow:none;
  --toast-bg:#F4F5F7;--toast-fg:#0B0C10;
  --chip:#1E222B;--chip-text:#F4F5F7;
  --hdr-bg:rgba(11,12,16,.78);--hdr-border:rgba(255,255,255,.06);
  --sheet-bg:#15171D;--sheet-border:rgba(255,255,255,.08);
  --phone-frame:#000000;
}
/* ---------------- политика «один бренд»: ночь остаётся синей ---------------- */
[data-accent="brand"] [data-theme="night"],.gs[data-accent="brand"][data-theme="night"]{
  --accent:#4D8DFF;--on-accent:#0B0C10;--accent-soft:rgba(77,141,255,.16);--accent-glow:rgba(77,141,255,.42);
  --bg-aura:radial-gradient(70% 28% at 50% -8%,rgba(77,141,255,.16) 0,transparent 70%);
  --plate:linear-gradient(180deg,#E3E7EE,#9EA6B4);
}

</style>
<style>
/* ============================================================================
   GymStack · components · v0.1 · 03.10.2026
   Восемь компонентов: поверхность, кнопка, таблетка, стек, степпер+чек, шторка,
   тост, таббар. Плюс каркас экрана и мелкие помощники (шапка, аватар, строка,
   KPI, числа, график). Всё через токены из tokens.css.
   ============================================================================ */
.gs *,.gs *::before,.gs *::after{box-sizing:border-box}
:where(.gs) :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
.gs :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gs b{font-weight:700}
.gs svg{display:block}
:where(.gs) :where(textarea,input){font:inherit;color:inherit}

/* ---- каркас: телефон, аура, шапка, экран ---- */
.phone{position:relative;width:390px;max-width:100%;height:844px;border-radius:46px;border:10px solid var(--phone-frame);overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--text);isolation:isolate;box-shadow:0 30px 60px rgba(0,0,0,.28)}
.aura{position:absolute;inset:0;background:var(--bg-aura);pointer-events:none;z-index:0}
.hdr{position:relative;z-index:3;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px;padding:0 12px;background:var(--hdr-bg);-webkit-backdrop-filter:blur(var(--blur)) saturate(160%);backdrop-filter:blur(var(--blur)) saturate(160%);border-bottom:1px solid var(--hdr-border)}
.hdr__l{color:var(--accent);font-size:16px;display:flex;align-items:center;gap:2px}
.hdr__l svg{width:22px;height:22px;margin-left:-6px}
.hdr__c{text-align:center}
.hdr__t{font-weight:700;font-size:16px;line-height:1.1}
.hdr__s{font-size:12px;color:var(--text-2);margin-top:2px}
.hdr__r{justify-self:end;display:flex;gap:4px}
.hdr__r span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--text-2);font-weight:700;font-size:14px}
.screen{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 16px calc(var(--tab-h) + 34px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.screen--main{padding-bottom:calc(52px + 60px + env(safe-area-inset-bottom,0px))}
.live{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;background:var(--bg);color:var(--text)}

/* ---- типографика ---- */
.h1{font-weight:800;font-size:var(--text-2xl);letter-spacing:-.025em;line-height:var(--lh-tight);text-wrap:balance}
.h2{font-weight:700;font-size:var(--text-md);color:var(--text-2);margin-top:4px}
.sub{color:var(--text-2);font-size:var(--text-sm);margin-top:3px}
.num{font-family:var(--font-num);font-weight:800;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:.92}
.num--hero{font-size:var(--text-num)}
.num--xl{font-size:40px}
.num--lg{font-size:var(--text-2xl);letter-spacing:-.03em}
.num--time{font-size:22px;letter-spacing:-.02em}
.t-ok{color:var(--ok);font-weight:600}.t-warn{color:var(--warn);font-weight:600}.t-bad{color:var(--bad);font-weight:600}.t-energy{color:var(--energy);font-weight:700}
.tiny{font-size:var(--text-xs);color:var(--text-3)}

/* ---- 1. Поверхность ---- */
.sf{position:relative;background:var(--surface-grad);border:1px solid var(--surface-border);border-radius:var(--r-l);padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-1)}
[data-theme="night"] .sf{box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.sf--inset{background:var(--surface-2);border-color:transparent;box-shadow:none}
.sf--glass,.glass{background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-highlight),var(--shadow-2)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.sf--glass,.glass,.hdr,.sheet,.tabbar{background:var(--surface)}}
.sf--ok::before,.sf--warn::before,.sf--bad::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 2px 2px 0}
.sf--ok::before{background:var(--ok)}.sf--warn::before{background:var(--warn)}.sf--bad::before{background:var(--bad)}
.sf--dim{opacity:.6}
.sf--tap{cursor:pointer;transition:transform var(--dur-fast) var(--ease-out)}
.sf--tap:active{transform:scale(.985)}
.sf__eyebrow{font-size:var(--text-xs);color:var(--text-2);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.sf__title{font-size:var(--text-lg);font-weight:700;letter-spacing:-.012em}
.sf__title--big{font-size:var(--text-xl);font-weight:800;letter-spacing:-.02em}
.sf__text{font-size:var(--text-sm);color:var(--text-2)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

/* ---- 2. Кнопка ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--tap);padding:0 16px;border-radius:var(--r-m);font-weight:700;font-size:var(--text-md);white-space:nowrap;user-select:none;-webkit-user-select:none;transition:transform var(--dur-fast) var(--ease-out),opacity var(--dur-fast),box-shadow var(--dur)}
.btn:active{transform:scale(.97)}
.btn--sm{min-height:36px;padding:0 12px;font-size:var(--text-sm);border-radius:10px}
.btn--primary{background:linear-gradient(180deg,var(--btn-sheen),rgba(255,255,255,0) 60%),var(--accent);color:var(--on-accent);box-shadow:inset 0 1px 0 var(--btn-inset),0 6px 16px var(--accent-glow)}
.btn--secondary{background:var(--accent-soft);color:var(--accent)}
.btn--quiet{background:var(--chip);color:var(--chip-text)}
.btn--danger{background:var(--bad-soft);color:var(--bad)}
.btn--energy{background:var(--energy-soft);color:var(--energy)}
.btn--ghost{color:var(--accent);padding:0 6px;min-height:32px}
.btn--block{display:flex;width:100%}
.btn--pill{border-radius:var(--r-pill)}
.btn--main{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));min-height:52px;border-radius:14px;font-size:var(--text-lg);z-index:6;box-shadow:inset 0 1px 0 var(--btn-inset),0 10px 24px var(--accent-glow)}
.btn svg{width:18px;height:18px}

/* ---- 3. Таблетка ---- */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-xs);font-weight:700;padding:3px 8px;border-radius:var(--r-pill);white-space:nowrap;letter-spacing:.01em;line-height:1.3}
.pill--ok{background:var(--ok-soft);color:var(--ok)}.pill--warn{background:var(--warn-soft);color:var(--warn)}.pill--bad{background:var(--bad-soft);color:var(--bad)}
.pill--muted{background:var(--chip);color:var(--text-2)}.pill--accent{background:var(--accent-soft);color:var(--accent)}.pill--energy{background:var(--energy-soft);color:var(--energy)}

/* ---- 4. Стек «блинов» ---- */
.stack{display:inline-flex;gap:2px;align-items:flex-end}
.stack i{display:block;width:8px;height:14px;border-radius:2px;background:var(--plate);box-shadow:var(--plate-sheen)}
.stack i.u{background:var(--plate-used);box-shadow:none}
.stack--lg i{width:18px;height:22px;border-radius:4px}
.stack--big{display:flex;flex-direction:column-reverse;gap:3px;align-items:center;width:124px}
.stack--big i{height:10px;border-radius:4px;width:var(--w,100%)}
.hero{flex-direction:row;align-items:center;justify-content:space-between;padding:18px 16px}
.hero__cap{font-size:var(--text-sm);color:var(--text-2);line-height:1.25;margin-top:8px}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding-top:4px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* ---- 5. Степпер и чек ---- */
.stp{display:flex;align-items:center;justify-content:space-between;background:var(--chip);border-radius:10px;height:40px;padding:0 3px;min-width:0}
.stp button{width:30px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--text-2);transition:background var(--dur-fast)}
.stp button:active{background:var(--surface-border)}
.stp b{font-family:var(--font-num);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;color:var(--text)}
.ck{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:background var(--dur-fast),border-color var(--dur-fast),transform var(--dur) var(--ease-spring);justify-self:end}
.ck svg{width:20px;height:20px}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff;animation:gs-pop var(--dur-slow) var(--ease-spring)}
.sethead,.setr{display:grid;grid-template-columns:18px 44px minmax(0,1fr) minmax(0,1fr) 40px;align-items:center;gap:5px}
.sethead{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;padding:2px 0 4px}
.setr{padding:6px 0;border-top:1px solid var(--line);position:relative}
.setr.done{opacity:.72}
.setr .sn{font-size:12px;color:var(--text-3);font-weight:700}
.setr .prev{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.pr{position:absolute;right:44px;top:-7px;font-style:normal;font-size:9px;font-weight:800;background:var(--energy);color:var(--on-energy);padding:1px 5px;border-radius:5px;letter-spacing:.06em;box-shadow:0 0 12px var(--energy-soft)}
.rest{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;position:sticky;top:0;z-index:5;background:var(--accent-soft);color:var(--text)}
.rest b{font-family:var(--font-num);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;color:var(--accent);flex:1}
.rest button{font-weight:700;color:var(--accent);font-size:var(--text-sm)}
.mic{position:absolute;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border);color:var(--accent);box-shadow:var(--shadow-2);transition:transform var(--dur-fast) var(--ease-out)}
.mic:active{transform:scale(.94)}
.mic svg{width:26px;height:26px}
[data-theme="night"] .mic{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 0 0 6px var(--accent-soft),0 10px 24px var(--accent-glow)}

/* ---- 6. Шторка ---- */
.sheet-bd{position:absolute;inset:0;background:rgba(10,12,16,.42);display:flex;align-items:flex-end;z-index:20;animation:gs-fade var(--dur) var(--ease-out)}
.sheet{width:100%;max-height:86%;overflow:auto;background:var(--sheet-bg);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%);border:1px solid var(--sheet-border);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:gs-up var(--dur-slow) var(--ease-spring)}
.sheet::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--line);align-self:center;flex:none}
.sheet__title{font-size:var(--text-xl);font-weight:800;letter-spacing:-.015em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:9px 13px;border-radius:10px;background:var(--chip);font-weight:600;font-size:var(--text-sm);transition:transform var(--dur-fast)}
.chips button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.chips button:active{transform:scale(.96)}

/* ---- 7. Тост ---- */
.toast{position:absolute;left:16px;right:16px;bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px));background:var(--toast-bg);color:var(--toast-fg);padding:11px 14px;border-radius:14px;font-size:var(--text-sm);font-weight:600;text-align:center;z-index:30;box-shadow:var(--shadow-2);animation:gs-up var(--dur) var(--ease-out)}

/* ---- 8. Таббар ---- */
.tabbar{position:absolute;left:var(--tab-inset);right:var(--tab-inset);bottom:var(--tab-bottom);height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding:5px 5px calc(5px + env(safe-area-inset-bottom,0px));border-radius:var(--tab-radius);background:var(--tab-bg);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%);border:1px solid var(--tab-border);box-shadow:var(--tab-shadow);display:grid;grid-template-columns:repeat(var(--n,5),1fr);z-index:5;overflow:hidden}
[data-theme="night"] .tabbar{border-left:0;border-right:0;border-bottom:0}
.tabbar__ind{position:absolute;top:5px;bottom:calc(5px + env(safe-area-inset-bottom,0px));left:5px;width:calc((100% - 10px)/var(--n,5));border-radius:var(--r-pill);background:var(--accent-soft);transform:translateX(calc(var(--i,0)*100%));transition:transform var(--dur-slow) var(--ease-spring);pointer-events:none}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:0 2px;font-size:9.5px;font-weight:600;letter-spacing:-.01em;color:var(--text-3);border-radius:var(--r-pill);transition:color var(--dur)}
.tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent)}
[data-theme="night"] .tabbar button[aria-current="page"] svg{filter:drop-shadow(0 0 8px var(--accent-glow))}

/* ---- помощники: аватар, строки, KPI, сессии, календарь, график ---- */
.av{display:inline-grid;place-items:center;width:var(--s,32px);height:var(--s,32px);border-radius:50%;font-weight:700;font-size:calc(var(--s,32px)*.36);flex:none;color:#1B1B22}
.hue0{background:#FFD6A5}.hue1{background:#BDE0FE}.hue2{background:#CDEAC0}.hue3{background:#FFC8DD}.hue4{background:#E2D5F8}.hue5{background:#FDE68A}

/* ================= действия ================= */
function copyText(t){var done=function(){toast('Скопировано')};try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){toast('Скопируйте текст вручную')})}else toast('Скопируйте текст вручную')}catch(e){toast('Скопируйте текст вручную')}}
function createSlot(){var sh=S.sheet;if(!sh.sel.length){toast('Выберите хотя бы одного клиента');return}var n=1;if(sh.repeat){var mn=Math.min.apply(null,sh.sel.map(function(id){return left(C(id))}));n=Math.max(1,mn)}
 for(var i=0;i<n;i++){var d=addDays(sh.date,7*i);var st={};sh.sel.forEach(function(id){st[id]='planned'});S.sessions.push({id:'n'+Date.now()+'_'+i,date:d,time:sh.time,c:sh.sel.slice(),tpl:sh.tpl||null,st:st})}
 S.sheet=null;S.t.calDay=sh.date;toast('Записано: '+whenLabel(sh.date)+' '+sh.time+(n>1?' + ещё '+(n-1)+' нед.':'')+' · участникам отправлено')}
function applyStatus(sid,cid,status){var s=sessionById(sid);var c=C(cid);s.st[cid]=status;var ded=(status==='noshow'&&S.trainer.deductNoShow)||(status==='late'&&S.trainer.deductLate)||status==='done';if(ded){c.pack.used=Math.min(c.pack.size,c.pack.used+1);if(left(c)===0)c.pack.ended=TODAY}
 if(status==='late'||status==='noshow')evt('deduct',{client:cid,status:status});if(status==='cancelled')evt('cancel',{client:cid,date:s.date,time:s.time});if(ded&&left(c)<=2&&status!=='done')evt('ending',{client:cid});
 toast(STL[status][0]+(ded?' · '+c.dat+' отправлено':''))}
function hoursUntil(s){var d=daysBetween(TODAY,s.date);var p=s.time.split(':');var n=NOW.split(':');return d*24+((+p[0])-(+n[0]))+((+p[1])-(+n[1]))/60}
function activatePack(){var sh=S.sheet;var c=C(sh.client);if(c.pack&&c.pack.bought)c.prevPacks.push({size:c.pack.size,bought:c.pack.bought,ended:TODAY,price:c.pack.price,method:c.pack.method});
 c.pack={size:sh.size,used:0,price:sh.price,bought:TODAY,method:sh.method,expires:sh.expiry?addDays(TODAY,sh.expiry):null,closed:false};c.renewOffered=false;var i=S.renewRequests.indexOf(sh.client);if(i>=0)S.renewRequests.splice(i,1);evt('pack',{client:sh.client,size:sh.size});S.sheet=null;toast('Пакет активирован · '+c.dat+' отправлено')}
function act(a,v){
 switch(a){
  case 'noop':return;
  case 'role':S.role=v;S.sheet=null;break;
  case 'theme':S.ui.theme=v;break;
  case 'reset':try{localStorage.removeItem(KEY)}catch(e){}S=fresh();if(TG)S.ui.theme=TG.colorScheme==='dark'?'night':'day';toast('Демо сброшено');break;
  case 'tab':if(S.role==='trainer'){S.t.tab=v;S.t.stack=[]}else{S.c.tab=v;S.c.stack=[]}break;
  case 'back':S.editWorkout=null;pop();break;
  case 'closeSheet':S.sheet=null;break;
  case 'onboardDone':S.onboarded=true;toast('Готово · пригласите первого клиента');break;
  case 'goToday':S.role='trainer';S.t.tab='today';S.t.stack=[];break;
  case 'openApp':S.role='client';S.c.tab='home';S.c.stack=[];break;
  case 'openSub':S.role='trainer';S.t.stack=['subscription'];break;
  case 'openClient':S.role='trainer';S.t.ctab='history';S.t.stack=['client:'+v];S.sheet=null;break;
  case 'ctab':S.t.ctab=v;break;
  case 'openWorkout':push('workout:'+v);break;
  case 'editWorkout':if(!guard())return;S.editWorkout=v;break;
  case 'cancelEdit':S.editWorkout=null;break;
  case 'wset':{var q=v.split(':');var key=S.t.stack[S.t.stack.length-1].slice(8).split(':');var w=null;C(key[0]).log.forEach(function(x){if(x.id===key[1])w=x});var st=w.ex[+q[0]].s[+q[1]];var d=parseFloat(q[3]);if(q[2]==='w')st[0]=Math.max(0,Math.round((st[0]+d)*2)/2);else st[1]=Math.max(1,st[1]+d);break}
  case 'saveWorkout':{var k2=v.split(':');var w2=null;C(k2[0]).log.forEach(function(x){if(x.id===k2[1])w2=x});w2.edited=TODAY;S.editWorkout=null;toast('Сохранено · '+C(k2[0]).dat+' видна пометка «изменено»');break}
  case 'startLive':startLive(v);break;
  case 'resumeLive':S.t.stack=['live'];break;
  case 'openSlot':S.role='trainer';S.sheet={type:'slot',id:v};break;
  case 'slotStatus':{if(!guard())return;var p=v.split(':');applyStatus(p[0],p[1],p[2]);S.sheet=null;break}
  case 'slotRemove':{if(!guard())return;var p2=v.split(':');var s=sessionById(p2[0]);if(hoursUntil(s)>0&&hoursUntil(s)<S.trainer.cancelHours){S.sheet={type:'lateAsk',sid:p2[0],cid:p2[1]};break}s.st[p2[1]]='cancelled';evt('cancel',{client:p2[1],date:s.date,time:s.time});S.sheet=null;toast('Убрано из слота · '+C(p2[1]).dat+' отправлено');break}
  case 'slotCancel':{if(!guard())return;var s3=sessionById(v);var late=hoursUntil(s3)>0&&hoursUntil(s3)<S.trainer.cancelHours;s3.c.forEach(function(id){if(s3.st[id]==='planned'){s3.st[id]='cancelled';evt('cancel',{client:id,date:s3.date,time:s3.time})}});S.sheet=null;toast('Отменена без списания · участникам отправлено'+(late?' (отмена тренером, порог не применяется)':''));break}
  case 'slotDelete':{if(!guard())return;S.sessions=S.sessions.filter(function(s){return s.id!==v});S.sheet=null;toast('Слот удалён');break}
  case 'slotTransfer':{var s4=sessionById(v);S.sheet={type:'transfer',id:v,date:s4.date,time:s4.time};break}
  case 'trDate':S.sheet.date=v;break;
  case 'trTime':S.sheet.time=v;break;
  case 'applyTransfer':{if(!guard())return;var s5=sessionById(S.sheet.id);s5.date=S.sheet.date;s5.time=S.sheet.time;s5.c.forEach(function(id){if(s5.st[id]==='planned')evt('transfer',{client:id,date:s5.date,time:s5.time})});S.sheet=null;S.t.calDay=s5.date;toast('Перенесено на '+whenLabel(s5.date)+' '+s5.time+' · участникам отправлено');break}
  case 'slotTpl':S.sheet={type:'tplPick',id:v};break;
  case 'setSlotTpl':{var p3=v.split(':');sessionById(p3[0]).tpl=p3[1]||null;S.sheet={type:'slot',id:p3[0]};toast('Шаблон: '+tplName(p3[1]||null));break}
  case 'slotAddPart':S.sheet={type:'addPart',id:v};break;
  case 'addPart':{var p4=v.split(':');var s6=sessionById(p4[0]);s6.c.push(p4[1]);s6.st[p4[1]]='planned';S.sheet={type:'slot',id:p4[0]};toast(C(p4[1]).first+' добавлен · отправлено сообщение');break}
  case 'calDay':S.t.calDay=v;break;
  case 'weekPrev':S.t.weekStart=addDays(S.t.weekStart,-7);S.t.calDay=S.t.weekStart;break;
  case 'weekNext':S.t.weekStart=addDays(S.t.weekStart,7);S.t.calDay=S.t.weekStart;break;
  case 'addSlot':if(!guard())return;S.sheet={type:'record',time:v,date:S.t.calDay,sel:[],tpl:'low',repeat:false};break;
  case 'newSlot':if(!guard())return;S.sheet={type:'record',time:'20:00',date:S.t.tab==='calendar'?S.t.calDay:TODAY,sel:[],tpl:'low',repeat:false};break;
  case 'bookClient':{if(!guard())return;var id=S.t.stack[S.t.stack.length-1].slice(7);S.sheet={type:'record',time:'18:00',date:'2026-10-06',sel:[id],tpl:'low',repeat:false};break}
  case 'startNow':{if(!guard())return;var st2={};st2[v]='planned';var ns={id:'n'+Date.now(),date:TODAY,time:'17:00',c:[v],tpl:null,st:st2};S.sessions.push(ns);startLive(ns.id);break}
  case 'selClient':{var arr=S.sheet.sel;var i2=arr.indexOf(v);if(i2>=0)arr.splice(i2,1);else arr.push(v);break}
  case 'selTpl':S.sheet.tpl=v;break;
  case 'selTime':S.sheet.time=v;break;
  case 'selDate':S.sheet.date=v;break;
  case 'toggleRepeat':S.sheet.repeat=!S.sheet.repeat;break;

  case 'invite':if(!guard())return;S.sheet={type:'invite',name:''};break;

  case 'shareLink':S.sheet=null;toast('Откроется выбор чата в Telegram');break;
  case 'newPack':if(!guard())return;S.role='trainer';S.sheet={type:'pack',client:v,size:S.trainer.packSize,price:S.trainer.packPrice,method:'СБП',expiry:S.trainer.expiryDefault,custom:false};break;
  case 'packSize':if(v==='custom'){S.sheet.custom=true}else{S.sheet.custom=false;S.sheet.size=+v;S.sheet.price=S.sheet.size*S.trainer.price}break;
  case 'packCustom':S.sheet.size=Math.max(1,S.sheet.size+(+v));S.sheet.price=S.sheet.size*S.trainer.price;break;
  case 'packPrice':S.sheet.price=Math.max(0,S.sheet.price+(+v));break;

  case 'activatePack':activatePack();break;
  case 'extendPack':{if(!guard())return;var ce=C(v);ce.pack.expires=addDays(TODAY,30);toast('Срок продлён до '+fmtD(ce.pack.expires)+' · '+ce.dat+' отправлено');break}
  case 'closePack':{if(!guard())return;var cc=C(v);var rest=left(cc);S.adjustLog.push({client:v,date:TODAY,delta:-rest,reason:'Истёк срок пакета'});cc.pack.used=cc.pack.size;cc.pack.closed=true;cc.pack.ended=TODAY;evt('adjust',{client:v,delta:-rest,reason:'Истёк срок пакета'});toast('Пакет закрыт · '+cc.dat+' отправлено');break}
  case 'adjust':if(!guard())return;S.sheet={type:'adjust',client:v,delta:0,reason:''};break;
  case 'adjDelta':{var ac=C(S.sheet.client);var nl=left(ac)+S.sheet.delta+(+v);if(nl<0||nl>ac.pack.size)return;S.sheet.delta+=(+v);break}
  case 'applyAdjust':{var sh=S.sheet;if(!sh.delta){toast('Измените остаток на ±1');return}if(!(sh.reason||'').trim()){toast('Укажите причину: её увидит клиент');return}var c4=C(sh.client);c4.pack.used-=sh.delta;S.adjustLog.push({client:sh.client,date:TODAY,delta:sh.delta,reason:sh.reason});evt('adjust',{client:sh.client,delta:sh.delta,reason:sh.reason});S.sheet=null;toast('Остаток изменён · '+c4.dat+' отправлено с причиной');break}
  case 'editClient':{if(!guard())return;var c5=C(v);S.sheet={type:'editClient',client:v,goal:c5.goal,phone:c5.phone,notes:c5.notes};break}

  case 'archiveClient':{if(!guard())return;var c7=C(v);c7.archived=!c7.archived;toast(c7.archived?'В архиве · история сохранена':'Возвращён из архива');if(c7.archived)S.t.stack=[];break}

  case 'part':S.live.active=v;break;
  case 'dw':case 'uw':case 'dr':case 'ur':{var q2=v.split(':');var P=part();var st3=P.ex[+q2[0]].sets[+q2[1]];if(a==='dw')st3.w=Math.max(0,Math.round((st3.w-2.5)*2)/2);if(a==='uw')st3.w=Math.round((st3.w+2.5)*2)/2;if(a==='dr')st3.r=Math.max(1,st3.r-1);if(a==='ur')st3.r=st3.r+1;break}
  case 'doneSet':{var q3=v.split(':');var P2=part();var e2=P2.ex[+q3[0]];var s7=e2.sets[+q3[1]];s7.done=!s7.done;if(s7.done&&e2.t==='w'){var b=bestW(P2.client,e2.n);if(b>0&&s7.w>b)toast('🏆 Новый рекорд: '+e2.n+' '+num(s7.w)+' кг')}break}

 }
 render();
